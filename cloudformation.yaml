AWSTemplateFormatVersion: '2010-09-09'
Description: 'CrowdStrike Falcon EKS Protection'

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Deployment Configuration
        Parameters:
          - Scope
          - Regions
          - OUs
          - OrganizationId
          - DelegatedAdmin
          - PermissionsBoundary
      - Label:
          default: Network Configuration
        Parameters:
          - VpcCidr
      - Label:
          default: Falcon API Credentials
        Parameters:
          - FalconClientId
          - FalconClientSecret
          - FalconCloud
      - Label:
          default: Falcon Operator Options
        Parameters:
          - FalconSensorType
          - Backend
          - DeployFalconAdmission
          - DeployFalconImageAnalyzer
      - Label:
          default: Resource Names
        Parameters:
          - ResourcePrefix
          - ResourceSuffix


Parameters:
  Scope:
    Type: String
    Default: 'organization'
    Description: Whether to deploy across the organization or locally to the current AWS account.
    AllowedValues: ['organization', 'local account']

  Regions:
    Type: List<String>
    Description: Which regions to deploy EventBridge rules.
    Default: ''

  OUs:
    Type: List<String>
    Description: Which OUs to onboard if Scope = organization.  If onboarding the entire organization, use the root OU (r-******).
    Default: ''

  OrganizationId:
    Type: String
    Description: Your AWS Organization Id if Scope = organization.
    Default: ''

  DelegatedAdmin:
    AllowedValues: ['true', 'false']
    Default: 'false'
    Description: Indicates whether this is a Delegated Administrator account.
    Type: String

  PermissionsBoundary:
    Type: String
    Description: The name of the policy used to set the permissions boundary for IAM roles.
    Default: ''

  VpcCidr:
    Type: String
    Default: '10.0.0.0/22'
    Description: CIDR block for the VPC

  FalconClientId:
    Type: String
    Description: CrowdStrike Falcon Client ID
    NoEcho: true
  
  FalconClientSecret:
    Type: String
    Description: CrowdStrike Falcon Client Secret  
    NoEcho: true

  FalconCloud:
    Type: String
    Description: CrowdStrike Falcon Cloud
    AllowedValues: ['us-1', 'us-2', 'eu-1', 'us-gov-1', 'us-gov-2']

  DeployFalconAdmission:
    Type: String
    Description: Deploy Falcon Kubernetes Admission Controller
    Default: 'true'
    AllowedValues: ['true', 'false']

  DeployFalconImageAnalyzer:
    Type: String 
    Description: Deploy Falcon Image Analyzer (requires additional API permissions)
    Default: 'true'
    AllowedValues: ['true', 'false']

  Backend:
    Type: String
    Description: Backend for Daemonset (node) sensor
    Default: 'kernel'
    AllowedValues: ['kernel', 'bpf']

  FalconSensorType:
    Type: String 
    Description: Which Falcon Sensor to deploy.  auto will determine sensor based on cluster type (Recommended)
    Default: 'auto'
    AllowedValues: ['auto', 'both', 'node', 'container']

  ResourcePrefix:
    Type: String
    Description: The prefix to be added to all resource names
    Default: 'crowdstrike-eks-protection'

  ResourceSuffix:
    Type: String
    Description: The suffix be added to all resource names
    Default: ''

Conditions:
  SetPermissionsBoundary: !Not [ !Equals [ !Ref PermissionsBoundary, '' ]]
  OrgDeployment: !Equals [ !Ref Scope, 'organization' ]
  IsDelegatedAdmin: !Equals [ !Ref 'DelegatedAdmin', true ]

Resources:
  # Store Falcon API credentials in Secrets Manager
  FalconCredentialsSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: crowdstrike/falcon-api-credentials
      Description: CrowdStrike Falcon API credentials
      SecretString: !Sub |
        {
          "client_id": "${FalconClientId}",
          "client_secret": "${FalconClientSecret}"
        }

  # GitHub repository configuration for script downloads
  EventHandlerParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /crowdstrike/falcon-eks-protection/handler-script-url
      Type: String
      Description: GitHub URL for event handler script
      Value: "https://raw.githubusercontent.com/CrowdStrike/aws-eks-protection/refs/heads/main/event_handler.sh"

  SetupScriptParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /crowdstrike/falcon-eks-protection/setup-script-url
      Type: String
      Description: GitHub URL for cluster setup script
      Value: "https://raw.githubusercontent.com/CrowdStrike/aws-eks-protection/refs/heads/main/setup_cluster.py"

  DeployScriptParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /crowdstrike/falcon-eks-protection/deploy-script-url
      Type: String
      Description: GitHub URL for deploy operator script
      Value: "https://raw.githubusercontent.com/CrowdStrike/aws-eks-protection/refs/heads/main/deploy_operator.sh"

  # Store K8s Manifest for Falcon Deployment
  FalconDeploymentParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /crowdstrike/falcon-eks-protection/falcon-deployment-manifest
      Type: String
      Description: CrowdStrike FalconDeployment YAML manifest
      Value: !Sub |
        apiVersion: falcon.crowdstrike.com/v1alpha1
        kind: FalconDeployment
        metadata:
          name: falcon-deployment
          namespace: default
        spec:
          # Use Kubernetes secret for API credentials
          falconSecret:
            enabled: true
            namespace: default
            secretName: falcon-api-secret
          
          # Falcon API configuration
          falcon_api:
            cloud_region: ${FalconCloud}

          # Component deployment flags
          deployNodeSensor: SET_NODE_SENSOR
          deployContainerSensor: SET_CONTAINER_SENSOR
          deployAdmissionController: SET_FALCON_ADMISSION
          deployImageAnalyzer: SET_IMAGE_ANALYZER

          # Set Daemonset Backend
          falconNodeSensor:
            node:
              backend: ${Backend}

          # Disable Default Injection of Container Sensor
          falconContainerSensor:
            injector:
              disableDefaultNamespaceInjection: true
              disableDefaultPodInjection: true

  # ECS Cluster
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${ResourcePrefix}-cluster${ResourceSuffix}"

  # CloudWatch Log Group
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/crowdstrike-falcon-eks-protection
      RetentionInDays: 30

  # ECS Task Execution Role
  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ResourcePrefix}-execution-role${ResourceSuffix}"
      PermissionsBoundary:
        Fn::If:
          - SetPermissionsBoundary
          - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/${PermissionsBoundary}'
          - Ref: AWS::NoValue
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy'
      Policies:
        - PolicyName: SecretsManagerAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Ref FalconCredentialsSecret

  # ECS Task Role (for EKS operations)
  ECSTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ResourcePrefix}-task-role${ResourceSuffix}"
      PermissionsBoundary:
        Fn::If:
          - SetPermissionsBoundary
          - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/${PermissionsBoundary}'
          - Ref: AWS::NoValue
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SecretsManagerAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Ref FalconCredentialsSecret
        - PolicyName: ParameterAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SetupScriptParameter}'
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DeployScriptParameter}'
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${EventHandlerParameter}'
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${FalconDeploymentParameter}'
        - PolicyName: TaskExecution
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - eks:DescribeCluster
                  - eks:ListClusters
                  - eks:ListFargateProfiles
                  - eks:CreateFargateProfile
                  - eks:DescribeFargateProfile
                  - iam:PassRole
                  - eks:ListNodeGroups
                  - eks:UpdateClusterConfig
                  - eks:DescribeUpdate
                  - eks:AssociateAccessPolicy
                  - ec2:DescribeSubnets
                  - ec2:DescribeVpcs
                  - ec2:DescribeRegions
                  - iam:CreateRole
                  - iam:AttachRolePolicy
                  - iam:GetRole
                  - iam:PassRole
                  - cloudformation:DescribeStacks
                  - cloudformation:ListStacks
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DescribeStackResources
                  - cloudformation:DescribeStackEvents
                Resource: "*"
              - Effect: Allow
                Action:
                  - eks:UpdateAccessEntry
                  - eks:CreateAccessEntry
                  - eks:DeleteAccessEntry
                  - eks:DescribeAccessEntry
                Resource: 
                  - !Sub 'arn:${AWS::Partition}:eks:*:${AWS::AccountId}:cluster/*'
                  - !Sub 'arn:${AWS::Partition}:eks:*:${AWS::AccountId}:access-entry/*/${ResourcePrefix}-task-role${ResourceSuffix}/${AWS::AccountId}/$/*'
        - PolicyName: AssumeRole
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sts:AssumeRole
                Resource: !Sub 'arn:${AWS::Partition}:iam::*:role/${ResourcePrefix}-execution-role${ResourceSuffix}'

  # ECS Task Definition
  ECSTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${ResourcePrefix}-cluster${ResourceSuffix}"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      Cpu: '1024'
      Memory: '2048'
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ECSTaskRole.Arn
      ContainerDefinitions:
        - Name: falcon-eks-protection
          Image: amazon/aws-cli:2.15.30
          Essential: true
          EntryPoint: ["/bin/bash"]
          Command:
            - "-c"
            - |
              # Install required tools
              yum update -y && yum install -y curl jq python3 python3-pip tar gzip unzip
              
              # Install kubectl (compatible with Kubernetes 1.31-1.34)
              curl -LO "https://dl.k8s.io/release/v1.33.0/bin/linux/amd64/kubectl"
              chmod +x kubectl && mv kubectl /usr/local/bin/
              
              # Install helm
              curl -fsSL https://get.helm.sh/helm-v3.13.0-linux-amd64.tar.gz | tar -xz
              mv linux-amd64/helm /usr/local/bin/
              
              # Install Python dependencies
              pip3 install boto3 botocore
              
              # Create working directory and download scripts
              mkdir -p /root/.kube /app && cd /app
              HANDLER_URL=$(aws ssm get-parameter --name $EVENT_HANDLER_PARAMETER --query Parameter.Value --output text)
              curl -L -o /app/event_handler.sh $HANDLER_URL
              SETUP_URL=$(aws ssm get-parameter --name $SETUP_SCRIPT_PARAMETER --query Parameter.Value --output text)
              curl -L -o /app/setup_cluster.py $SETUP_URL
              DEPLOY_URL=$(aws ssm get-parameter --name $DEPLOY_SCRIPT_PARAMETER --query Parameter.Value --output text)
              curl -L -o /app/deploy_operator.sh $DEPLOY_URL
              chmod +x /app/*.sh && chmod +x /app/*.py
              
              # Execute
              /app/event_handler.sh
          WorkingDirectory: "/app"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
          Environment:
            - Name: DEPLOY_FALCON_OPERATOR
              Value: "true"
            - Name: DEPLOY_FALCON_RESOURCES
              Value: "true"
            - Name: FALCON_CLOUD_REGION
              Value: "autodiscover"
            - Name: FALCON_OPERATOR_VERSION
              Value: "latest"
            - Name: DEPLOY_FALCON_ADMISSION
              Value: !Ref DeployFalconAdmission
            - Name: DEPLOY_FALCON_IMAGE_ANALYZER
              Value: !Ref DeployFalconImageAnalyzer
            - Name: SENSOR_TYPE
              Value: !Ref FalconSensorType
            - Name: DEPLOY_SCRIPT_PARAMETER
              Value: !Ref DeployScriptParameter
            - Name: SETUP_SCRIPT_PARAMETER
              Value: !Ref SetupScriptParameter
            - Name: EVENT_HANDLER_PARAMETER
              Value: !Ref EventHandlerParameter
            - Name: FALCON_DEPLOYMENT_PARAMETER
              Value: !Ref FalconDeploymentParameter
            - Name: EKS_CLUSTER_NAME
              Value: 'SourcedFromEvent'
            - Name: AWS_REGION
              Value: 'SourcedFromEvent'
            - Name: NAT_IP
              Value: !Ref NatGateway1EIP
            - Name: TASK_ARN
              Value: !GetAtt ECSTaskRole.Arn
            - Name: SCOPE
              Value: !Ref Scope
            - Name: ACCOUNT_ID
              Value: 'SourcedFromEvent'
            - Name: PARTITION
              Value: !Ref AWS::Partition
            - Name: SWITCH_ROLE
              Value: 
                Fn::If:
                  - OrgDeployment
                  - !Sub '${ResourcePrefix}-execution-role${ResourceSuffix}'
                  - 'SingleAccount'
          Secrets:
            - Name: FALCON_CLIENT_ID
              ValueFrom: !Sub "${FalconCredentialsSecret}:client_id::"
            - Name: FALCON_CLIENT_SECRET
              ValueFrom: !Sub "${FalconCredentialsSecret}:client_secret::"

  # VPC
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub "${ResourcePrefix}-vpc${ResourceSuffix}"

  # Internet Gateway
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${ResourcePrefix}-igw${ResourceSuffix}"

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref VPC

  # Public Subnets (for NAT Gateway)
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 4, 8]]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${ResourcePrefix}-public-subnet${ResourceSuffix}"

  # Private Subnets (for Fargate tasks)
  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: !Select [2, !Cidr [!Ref VpcCidr, 4, 8]]
      Tags:
        - Key: Name
          Value: !Sub "${ResourcePrefix}-private-subnet${ResourceSuffix}"

  # NAT Gateway
  NatGateway1EIP:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub "${ResourcePrefix}-nat-eip${ResourceSuffix}"

  NatGateway1:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatGateway1EIP.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags:
        - Key: Name
          Value: !Sub "${ResourcePrefix}-nat${ResourceSuffix}"

  # Route Tables
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "${ResourcePrefix}-public-routes${ResourceSuffix}"

  DefaultPublicRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet1

  PrivateRouteTable1:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "${ResourcePrefix}-private-routes${ResourceSuffix}"

  DefaultPrivateRoute1:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable1
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway1

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable1
      SubnetId: !Ref PrivateSubnet1

  # Security Group for Fargate Tasks
  FargateTaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${ResourcePrefix}-ecs-sg${ResourceSuffix}"
      GroupDescription: Security group for ECS Fargate tasks
      VpcId: !Ref VPC
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound traffic
      Tags:
        - Key: Name
          Value: !Sub "${ResourcePrefix}-ecs-sg${ResourceSuffix}"

  # EventBridge Configuration
  EventBus: 
    Type: AWS::Events::EventBus
    Properties: 
      Name: !Sub "${ResourcePrefix}-eventbus${ResourceSuffix}"
      Policy: !Sub |
        {
          "Version": "2012-10-17",
          "Statement": [{
            "Sid": "AllowAllAccountsFromOrganizationToPutEvents",
            "Effect": "Allow",
            "Principal": "*",
            "Action": "events:PutEvents",
            "Resource": "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/${ResourcePrefix}-eventbus${ResourceSuffix}",
            "Condition": {
              "StringEquals": {
                "aws:PrincipalOrgID": "${OrganizationId}"
              }
            }
          }]
        }

  # EventBridge Rule for EKS Cluster Creation
  PrimaryEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${ResourcePrefix}-rule${ResourceSuffix}"
      Description: Trigger CrowdStrike Falcon deployment when EKS cluster is created
      EventBusName: !GetAtt EventBus.Arn
      EventPattern:
        source: ["aws.eks"]
        detail-type: ["AWS API Call via CloudTrail"]
        detail:
          eventSource: ["eks.amazonaws.com"]
          eventName: ["CreateCluster"]
          responseElements:
            cluster:
              status: ["CREATING"]
      State: ENABLED
      Targets:
        - Id: "FalconEKSProtectionTarget"
          Arn: !GetAtt ECSCluster.Arn
          RoleArn: !GetAtt PrimaryEventRole.Arn
          InputTransformer:
            InputPathsMap:
              clusterName: "$.detail.responseElements.cluster.name"
              awsRegion: "$.detail.awsRegion" 
              accountId: "$.detail.userIdentity.accountId"
              eventSource: "$.detail.eventSource"
              eventName: "$.detail.eventName"
              eventTime: "$.detail.eventTime"
            InputTemplate: |
              {
                "containerOverrides": [
                  {
                    "name": "falcon-eks-protection",
                    "environment": [
                      {"name": "EKS_CLUSTER_NAME", "value": "<clusterName>"},
                      {"name": "AWS_REGION", "value": "<awsRegion>"},
                      {"name": "ACCOUNT_ID", "value": "<accountId>"},
                      {"name": "EVENT_SOURCE", "value": "<eventSource>"},
                      {"name": "EVENT_NAME", "value": "<eventName>"},
                      {"name": "EVENT_TIME", "value": "<eventTime>"}
                    ]
                  }
                ]
              }
          EcsParameters:
            TaskDefinitionArn: !Ref ECSTaskDefinition
            LaunchType: FARGATE
            NetworkConfiguration:
              AwsVpcConfiguration:
                SecurityGroups:
                  - !Ref FargateTaskSecurityGroup
                Subnets: 
                  - !Ref PrivateSubnet1
                AssignPublicIp: DISABLED
            PlatformVersion: LATEST

  # EventBridge Service Role
  PrimaryEventRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ResourcePrefix}-primary-eb-role${ResourceSuffix}"
      PermissionsBoundary:
        Fn::If:
          - SetPermissionsBoundary
          - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/${PermissionsBoundary}'
          - Ref: AWS::NoValue
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: EventBridgeECSPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ecs:RunTask
                Resource: !Ref ECSTaskDefinition
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource:
                  - !GetAtt ECSTaskExecutionRole.Arn
                  - !GetAtt ECSTaskRole.Arn

  # EventBridge Service Role
  ForwardEventRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ResourcePrefix}-forward-eb-role${ResourceSuffix}"
      PermissionsBoundary:
        Fn::If:
          - SetPermissionsBoundary
          - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/${PermissionsBoundary}'
          - Ref: AWS::NoValue
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: EventBridgeForwardEvents
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - events:PutEvents
                Resource: !Sub 'arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/${ResourcePrefix}-eventbus${ResourceSuffix}'
  
  # StackSets
  LocalEbStackSet:
    Type: AWS::CloudFormation::StackSet
    Properties:
      AdministrationRoleARN: !GetAtt StackSetAdministrationRole.Arn
      ExecutionRoleName: !Ref StackSetExecutionRole
      StackSetName: !Sub "${ResourcePrefix}-local-eb-stackset${ResourceSuffix}"
      Description: StackSet to deploy local eventbridge rules in each region for CrowdStrike EKS Protection.
      PermissionModel: SELF_MANAGED
      Parameters:
        - ParameterKey: EventBusName
          ParameterValue: !Ref EventBus
        - ParameterKey: EventBusAccount
          ParameterValue: !Ref AWS::AccountId
        - ParameterKey: EventBusRegion
          ParameterValue: !Ref AWS::Region
        - ParameterKey: EventBridgeRoleName
          ParameterValue: !Sub "${ResourcePrefix}-forward-eb-role${ResourceSuffix}"
      OperationPreferences:
        ConcurrencyMode: SOFT_FAILURE_TOLERANCE
        MaxConcurrentPercentage: 100
        FailureTolerancePercentage: 50
        RegionConcurrencyType: PARALLEL
      StackInstancesGroup:
        - DeploymentTargets:
            AccountFilterType: NONE
            Accounts:
              - !Ref AWS::AccountId
          Regions: !Ref Regions
      TemplateBody: |
        ---
        AWSTemplateFormatVersion: '2010-09-09'
        Parameters:
          EventBusRegion:
            Type: String
          EventBusAccount:
            Type: String
          EventBusName:
            Type: String
          EventBridgeRoleName:
            Type: String
        Resources:
          EbRule:
            Type: AWS::Events::Rule
            Properties: 
              Description: "Invoke CrowdStrike EKS Protection when clusters are created."
              EventPattern: 
                source: 
                  - "aws.eks"
                detail-type: 
                  - "AWS API Call via CloudTrail"
                detail: 
                  eventSource: 
                    - "eks.amazonaws.com"
                  eventName:
                    - "CreateCluster"
              State: "ENABLED"
              Name: crowdstrike-eks-rule
              Targets:
                - Arn: !Sub arn:${AWS::Partition}:events:${EventBusRegion}:${EventBusAccount}:event-bus/${EventBusName}
                  Id: "CrowdStrikeEKSEventBus"
                  RoleArn: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${EventBridgeRoleName}

  OrgEbStackSet:
    Type: AWS::CloudFormation::StackSet
    Condition: OrgDeployment
    Properties:
      StackSetName: !Sub "${ResourcePrefix}-org-eb-stackset${ResourceSuffix}"
      Description: StackSet to deploy eventbridge rules in each region of member accounts for CrowdStrike EKS Protection.
      Parameters:
        - ParameterKey: EventBusName
          ParameterValue: !Ref EventBus
        - ParameterKey: EventBusAccount
          ParameterValue: !Ref AWS::AccountId
        - ParameterKey: EventBusRegion
          ParameterValue: !Ref AWS::Region
        - ParameterKey: EventBridgeRoleName
          ParameterValue: !Sub "${ResourcePrefix}-eb-role${ResourceSuffix}"
      PermissionModel: SERVICE_MANAGED
      CallAs: !If [ IsDelegatedAdmin, 'DELEGATED_ADMIN', 'SELF' ]
      AutoDeployment:
        Enabled: true
        RetainStacksOnAccountRemoval: true
      OperationPreferences:
        ConcurrencyMode: SOFT_FAILURE_TOLERANCE
        MaxConcurrentPercentage: 100
        FailureTolerancePercentage: 50
        RegionConcurrencyType: PARALLEL
      StackInstancesGroup:
        - DeploymentTargets:
            AccountFilterType: NONE
            OrganizationalUnitIds: !Ref OUs
          Regions: !Ref Regions
      TemplateBody: |
        ---
        AWSTemplateFormatVersion: '2010-09-09'

        Parameters:
          EventBusRegion:
            Type: String
          EventBusAccount:
            Type: String
          EventBusName:
            Type: String
          EventBridgeRoleName:
            Type: String

        Resources:
          EKSRule:
            Type: AWS::Events::Rule
            Properties: 
              Description: "Invoke CrowdStrike EKS Protection when clusters are created."
              EventPattern: 
                source: 
                  - "aws.eks"
                detail-type: 
                  - "AWS API Call via CloudTrail"
                detail: 
                  eventSource: 
                    - "eks.amazonaws.com"
                  eventName:
                    - "CreateCluster"
              State: "ENABLED"
              Name: crowdstrike-eks-rule
              Targets:
                - Arn: !Sub arn:${AWS::Partition}:events:${EventBusRegion}:${EventBusAccount}:event-bus/${EventBusName}
                  Id: "CrowdStrikeEKSEventBus"
                  RoleArn: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${EventBridgeRoleName}

  OrgRolesStackSet:
    Type: AWS::CloudFormation::StackSet
    Condition: OrgDeployment
    Properties:
      StackSetName: !Sub "${ResourcePrefix}-org-roles-stackset${ResourceSuffix}"
      Description: StackSet to deploy IAM roles to member accounts for CrowdStrike EKS Protection.
      Capabilities:
        - CAPABILITY_NAMED_IAM
      Parameters:
        - ParameterKey: EKSExecutionRoleName
          ParameterValue: !Sub "${ResourcePrefix}-execution-role${ResourceSuffix}"
        - ParameterKey: EventBridgeRoleName
          ParameterValue: !Sub "${ResourcePrefix}-eb-role${ResourceSuffix}"
        - ParameterKey: EventBusAccount
          ParameterValue: !Ref AWS::AccountId
        - ParameterKey: EventBusName
          ParameterValue: !Ref EventBus
        - ParameterKey: ECSTaskRole
          ParameterValue: !Ref ECSTaskRole
        - ParameterKey: PermissionsBoundary
          ParameterValue: !Ref PermissionsBoundary
      PermissionModel: SERVICE_MANAGED
      CallAs: !If [ IsDelegatedAdmin, 'DELEGATED_ADMIN', 'SELF' ]
      AutoDeployment:
        Enabled: true
        RetainStacksOnAccountRemoval: false
      OperationPreferences:
        ConcurrencyMode: SOFT_FAILURE_TOLERANCE
        MaxConcurrentPercentage: 100
        FailureTolerancePercentage: 50
        RegionConcurrencyType: PARALLEL
      StackInstancesGroup:
        - DeploymentTargets:
            AccountFilterType: NONE
            OrganizationalUnitIds: !Ref OUs
          Regions:
            - !Ref AWS::Region
      TemplateBody: |
        ---
        AWSTemplateFormatVersion: '2010-09-09'

        Parameters:
          EKSExecutionRoleName:
            Type: String
          EventBridgeRoleName:
            Type: String
          EventBusAccount:
            Type: String
          EventBusName:
            Type: String
          ECSTaskRole:
            Type: String
          PermissionsBoundary:
            Type: String
            Default: ''

        Conditions:
          SetPermissionsBoundary: !Not [ !Equals [ !Ref PermissionsBoundary, '' ]]

        Resources:
          EventBridgeRole:
            Type: 'AWS::IAM::Role'
            Properties:
              RoleName: !Ref EventBridgeRoleName
              PermissionsBoundary:
                Fn::If:
                  - SetPermissionsBoundary
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/${PermissionsBoundary}'
                  - Ref: AWS::NoValue
              AssumeRolePolicyDocument:
                Version: "2012-10-17"
                Statement:
                  - Effect: Allow
                    Principal:
                      Service:
                        - events.amazonaws.com
                    Action:
                      - 'sts:AssumeRole'
              Policies:
                - PolicyName: EventBridgeForwardEvents
                  PolicyDocument:
                    Version: "2012-10-17"
                    Statement:
                      - Effect: Allow
                        Action:
                          - events:PutEvents
                        Resource:
                          - !Sub arn:${AWS::Partition}:events:${AWS::Region}:${EventBusAccount}:event-bus/${EventBusName}
          
          EKSExecutionRole:
            Type: 'AWS::IAM::Role'
            Properties:
              RoleName: !Ref EKSExecutionRoleName
              PermissionsBoundary:
                Fn::If:
                  - SetPermissionsBoundary
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/${PermissionsBoundary}'
                  - Ref: AWS::NoValue
              AssumeRolePolicyDocument:
                Version: "2012-10-17"
                Statement:
                  - Effect: Allow
                    Principal:
                      AWS: 
                        - !Sub arn:${AWS::Partition}:iam::${EventBusAccount}:role/${EKSExecutionRoleName}
                        - !Sub arn:${AWS::Partition}:sts::${EventBusAccount}:role/${ECSTaskRole}
                    Action:
                      - 'sts:AssumeRole'
              Policies:
                - PolicyName: crowdstrike-eks-execution-policy
                  PolicyDocument:
                    Version: "2012-10-17"
                    Statement:
                      - Effect: Allow
                        Action: 
                          - eks:DescribeCluster
                          - eks:ListClusters
                          - eks:ListFargateProfiles
                          - eks:CreateFargateProfile
                          - eks:DescribeFargateProfile
                          - iam:PassRole
                          - iam:GetRole
                          - eks:ListNodeGroups
                          - ec2:DescribeRegions
                          - eks:UpdateClusterConfig
                          - eks:DescribeUpdate
                          - eks:AssociateAccessPolicy
                          - cloudformation:DescribeStacks
                          - cloudformation:ListStacks
                          - cloudformation:CreateStack
                          - cloudformation:UpdateStack
                          - cloudformation:DescribeStackResources
                          - cloudformation:DescribeStackEvents
                        Resource: '*'
                      - Effect: Allow
                        Action: 
                          - ec2:DescribeRegions
                        Resource: '*'
                      - Effect: Allow
                        Action:
                          - eks:UpdateAccessEntry
                          - eks:CreateAccessEntry
                          - eks:DeleteAccessEntry
                          - eks:DescribeAccessEntry
                        Resource: 
                          - !Sub 'arn:${AWS::Partition}:eks:*:${AWS::AccountId}:cluster/*'
                          - !Sub 'arn:${AWS::Partition}:eks:*:${AWS::AccountId}:access-entry/*/${ECSTaskRole}/${EventBusAccount}/$/*'

  # StackSet Roles
  StackSetAdministrationRole:
    Type: AWS::IAM::Role
    Properties:
      PermissionsBoundary:
        Fn::If:
          - SetPermissionsBoundary
          - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/${PermissionsBoundary}'
          - Ref: AWS::NoValue
      RoleName: !Sub "${ResourcePrefix}-stackset-admin-role${ResourceSuffix}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          Action: sts:AssumeRole
          Principal:
            Service: cloudformation.amazonaws.com
          Effect: Allow
          Sid: ''
      Policies:
        - PolicyName: crowdstrike-eks-stackset-execution
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Action: sts:AssumeRole
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ResourcePrefix}-stackset-execution-role${ResourceSuffix}"
                Effect: Allow

  StackSetExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      PermissionsBoundary:
        Fn::If:
          - SetPermissionsBoundary
          - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/${PermissionsBoundary}'
          - Ref: AWS::NoValue
      RoleName: !Sub "${ResourcePrefix}-stackset-execution-role${ResourceSuffix}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          Action: sts:AssumeRole
          Principal:
            AWS: !GetAtt StackSetAdministrationRole.Arn
          Effect: Allow
          Sid: ''
      Policies:
        - PolicyName: crowdstrike-eks-stackset-execution
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Action:
                - events:DeleteRule
                - events:PutTargets
                - events:DescribeRule
                - iam:PassRole
                - events:EnableRule
                - events:PutRule
                - events:RemoveTargets
                - events:DisableRule
                Resource:
                - !Sub arn:${AWS::Partition}:events:*:*:rule/crowdstrike-eks-rule*
                - !Sub arn:${AWS::Partition}:events:*:*:rule/*/crowdstrike-eks-rule*
                - !Sub arn:${AWS::Partition}:iam::*:role/${ResourcePrefix}-forward-eb-role${ResourceSuffix}
                Effect: Allow
              - Action: cloudformation:*
                Resource: '*'
                Effect: Allow

Outputs:
  ECSClusterArn:
    Description: ARN of the ECS Cluster
    Value: !GetAtt ECSCluster.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ECSClusterArn"
  
  TaskDefinitionArn:
    Description: ARN of the ECS Task Definition
    Value: !Ref ECSTaskDefinition
    Export:
      Name: !Sub "${AWS::StackName}-TaskDefinitionArn"

  EventRuleArn:
    Description: ARN of the EventBridge Rule
    Value: !GetAtt PrimaryEventRule.Arn
    Export:
      Name: !Sub "${AWS::StackName}-EventRuleArn"

  TaskSubnetId:
    Description: Subnet for the ECS Task
    Value: !Ref PrivateSubnet1
    Export:
      Name: !Sub "${AWS::StackName}-TaskSubnetId"

  TaskSecurityGroup:
    Description: Security Group for the ECS Task
    Value: !Ref FargateTaskSecurityGroup
    Export:
      Name: !Sub "${AWS::StackName}-TaskSecurityGroup"
