name: CloudFormation Lint

on:
  push:
    branches: [ main ]
    paths:
      - '**.yaml'
      - '**.yml'
      - '**.json'
  pull_request:
    branches: [ main ]
    paths:
      - '**.yaml'
      - '**.yml'
      - '**.json'

jobs:
  cfn-lint:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install cfn-lint
      run: |
        python -m pip install --upgrade pip
        pip install cfn-lint
        
    - name: Lint CloudFormation templates
      run: |
        # Find and lint CloudFormation files (excluding .github directory)
        find . -not -path "./.github/*" \( -name "*.yaml" -o -name "*.yml" -o -name "*.json" \) | while read file; do
          echo "Linting $file"
          cfn-lint --ignore-checks W1030 "$file" || exit 1
        done
